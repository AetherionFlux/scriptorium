name: Docker (GHCR)

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Scriptorium
            org.opencontainers.image.description=Modern markdown wiki: spaces, permissions, in-browser editing
            org.opencontainers.image.source=${{ github.repository_url }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -e
          # metadata-action returns newline-separated tags; take the first
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker pull "$IMAGE"
          docker run -d --name scriptorium-smoke -p 8787:8787 -v scriptorium-smoke-data:/data "$IMAGE"
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/health || true)
            [ "$code" = "200" ] && break
          done
          [ "$code" = "200" ] || { docker logs scriptorium-smoke; echo "smoke test failed"; exit 1; }
          echo "image smoke test OK ($IMAGE)"