services:
  scriptorium:
    image: ghcr.io/aetherionflux/scriptorium:latest
    ports:
      - "8787:8787"
    volumes:
      - scriptorium-data:/data
    environment:
      # Set explicitly to keep sessions alive across container rebuilds.
      # SESSION_SECRET: change-me-in-production
    restart: unless-stopped

volumes:
  scriptorium-data: