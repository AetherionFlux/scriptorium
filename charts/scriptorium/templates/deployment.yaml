apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scriptorium.fullname" . }}
  labels:
    {{- include "scriptorium.labels" . | nindent 4 }}
spec:
  {{- if not (eq (int .Values.replicaCount) 1) }}
  {{- fail "replicaCount must be 1: Scriptorium uses a single-writer SQLite database on a ReadWriteOnce volume" }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "scriptorium.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scriptorium.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scriptorium
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: PORT
              value: "8787"
            - name: DATA_DIR
              value: /data
            {{- if .Values.env.SESSION_SECRET }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "scriptorium.fullname" . }}-secret
                  key: session-secret
            {{- end }}
            {{- if .Values.env.SESSION_MAX_AGE_DAYS }}
            - name: SESSION_MAX_AGE_DAYS
              value: {{ .Values.env.SESSION_MAX_AGE_DAYS | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env.extra }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "scriptorium.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
